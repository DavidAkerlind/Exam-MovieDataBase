name: CI

on:
    push:
    pull_request:

jobs:
    worker-tests:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: worker/package-lock.json
            - run: npm ci
              working-directory: worker
            - run: npm test
              working-directory: worker
