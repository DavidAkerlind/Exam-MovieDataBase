# Optional: deploy the whole app (website + API, one Worker) with GitHub Actions on every
# push to main. You do NOT need this if you connected the repo in the Cloudflare
# dashboard (Workers Builds), which already deploys on every push. Use one or the other.
# One-time setup (repo Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN  (template "Edit Cloudflare Workers")
#   CLOUDFLARE_ACCOUNT_ID
#   TMDB_API_KEY, OMDB_API_KEY  (pushed to the Worker as encrypted secrets)
# Without the Cloudflare secrets this workflow does nothing.
name: Deploy to Cloudflare

on:
    push:
        branches: [main]
    workflow_dispatch:

jobs:
    deploy:
        runs-on: ubuntu-latest
        env:
            CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
            CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
            TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
            OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              if: env.CLOUDFLARE_API_TOKEN != ''
              with:
                  node-version: 22
            - run: npm ci && npm --prefix worker ci && npm test
              if: env.CLOUDFLARE_API_TOKEN != ''
            - uses: cloudflare/wrangler-action@v3
              if: env.CLOUDFLARE_API_TOKEN != ''
              with:
                  apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  secrets: |
                      TMDB_API_KEY
                      OMDB_API_KEY
