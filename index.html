<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
        <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://image.tmdb.org; connect-src 'self' https: http://localhost:* http://127.0.0.1:*; frame-src https://www.youtube-nocookie.com; object-src 'none'; base-uri 'self'; form-action 'self'" />
        <title>MMDb · My Movie Database</title>
        <meta name="description" content="Discover the best movies of all time, watch trailers, search films and people, and keep your favourites in one place." />
        <meta name="theme-color" content="#05060d" />
        <meta name="color-scheme" content="dark" />
        <meta property="og:title" content="MMDb · My Movie Database" />
        <meta property="og:description" content="Discover the best movies of all time, watch trailers, search films and people, and keep your favourites in one place." />
        <meta property="og:type" content="website" />

        <link rel="icon" href="./res/icons/favicon.svg" type="image/svg+xml" />
        <link rel="apple-touch-icon" href="./res/icons/apple-touch-icon.png" />
        <link rel="manifest" href="./manifest.webmanifest" />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link rel="preconnect" href="https://image.tmdb.org" />
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&display=swap" />
        <link rel="stylesheet" href="./styles/style.css" />
        <script type="module" src="./scripts/script.js" blocking="render"></script>
    </head>
    <body data-page="home">
        <main id="main" class="page page--home" tabindex="-1">
            <noscript><p class="noscript glass">MMDb needs JavaScript to load movies. Please enable it and reload the page.</p></noscript>
            <section class="hero">
                <h1 class="landing-page-title">MMDb<span class="landing-page-title__tm">™</span></h1>
                <p class="hero__tagline">
                    Discover great films, watch trailers and keep your favourites in one place.
                </p>
            </section>

            <!-- Trailer carousel -->
            <section class="trailers" id="trailers" aria-label="Featured trailers">
                <div class="trailers__skeleton skeleton" aria-hidden="true"></div>
            </section>

            <!-- Our recommended movies section -->
            <section class="section" aria-labelledby="recommendationsTitle">
                <header class="section__head">
                    <h2 class="popular-title" id="recommendationsTitle">Our recommendations</h2>
                    <p class="section__sub">The highest rated movies of all time</p>
                </header>
                <div id="podiumContainer" class="podium-section"></div>
                <section class="card-container" id="cardContainer" aria-label="Rank 4 to 15"></section>
                <ol class="movie-list" id="movieList" aria-label="Rank 16 to 20"></ol>
            </section>

            <!-- Trending -->
            <section class="section" id="trendingSection" aria-labelledby="trendingTitle">
                <header class="section__head">
                    <h2 id="trendingTitle">Trending this week</h2>
                    <p class="section__sub">What everybody is watching right now</p>
                </header>
                <ul class="rail" id="trendingRail"></ul>
            </section>
        </main>
    </body>
</html>
