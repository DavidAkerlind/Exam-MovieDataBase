<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
        <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://image.tmdb.org; connect-src 'self' https: http://localhost:* http://127.0.0.1:*; frame-src https://www.youtube-nocookie.com; object-src 'none'; base-uri 'self'; form-action 'self'" />
        <title>Movie · MMDb</title>
        <meta name="description" content="Ratings, plot, cast and trailer for a movie on MMDb." />
        <meta name="theme-color" content="#05060d" />
        <meta name="color-scheme" content="dark" />
        <meta property="og:title" content="Movie · MMDb" />
        <meta property="og:description" content="Ratings, plot, cast and trailer for a movie on MMDb." />
        <meta property="og:type" content="website" />

        <link rel="icon" href="./res/icons/favicon.svg" type="image/svg+xml" />
        <link rel="apple-touch-icon" href="./res/icons/apple-touch-icon.png" />
        <link rel="manifest" href="./manifest.webmanifest" />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link rel="preconnect" href="https://image.tmdb.org" />
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&display=swap" />
        <link rel="stylesheet" href="./styles/style.css" />
        <script type="module" src="./scripts/script.js" blocking="render"></script>
    </head>
    <body data-page="movie">
        <main id="main" class="page page--movie" tabindex="-1">
            <div class="movie-backdrop" id="movieBackdrop" aria-hidden="true"></div>
            <noscript><p class="noscript glass">MMDb needs JavaScript to load movies. Please enable it and reload the page.</p></noscript>
            <!-- Movie detailed information -->
            <section class="movie-info" id="movieInfo"></section>
            <div id="movieExtras"></div>
        </main>
    </body>
</html>
