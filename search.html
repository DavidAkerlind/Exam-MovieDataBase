<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
        <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://image.tmdb.org; connect-src 'self' https: http://localhost:* http://127.0.0.1:*; frame-src https://www.youtube-nocookie.com; object-src 'none'; base-uri 'self'; form-action 'self'" />
        <title>Search · MMDb</title>
        <meta name="description" content="Search MMDb for movies and people." />
        <meta name="theme-color" content="#05060d" />
        <meta name="color-scheme" content="dark" />
        <meta property="og:title" content="Search · MMDb" />
        <meta property="og:description" content="Search MMDb for movies and people." />
        <meta property="og:type" content="website" />

        <link rel="icon" href="./res/icons/favicon.svg" type="image/svg+xml" />
        <link rel="apple-touch-icon" href="./res/icons/apple-touch-icon.png" />
        <link rel="manifest" href="./manifest.webmanifest" />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link rel="preconnect" href="https://image.tmdb.org" />
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&display=swap" />
        <link rel="stylesheet" href="./styles/style.css" />
        <script type="module" src="./scripts/script.js" blocking="render"></script>
    </head>
    <body data-page="search">
        <main id="main" class="page page--search" tabindex="-1">
            <noscript><p class="noscript glass">MMDb needs JavaScript to load movies. Please enable it and reload the page.</p></noscript>
            <header class="page-head">
                <h1 class="search-title" id="searchHeader">Search results</h1>
                <p class="page-head__sub" id="searchSummary" aria-live="polite"></p>
            </header>

            <div class="search-container"></div>

            <section class="people" id="peopleSection" aria-labelledby="peopleTitle" hidden>
                <header class="section__head"><h2 id="peopleTitle">People</h2></header>
                <ul class="people-strip" id="peopleStrip"></ul>
            </section>

            <section class="card-container" id="cardContainer" aria-label="Movie results"></section>

            <div class="load-more" id="loadMore" hidden>
                <button class="btn btn--glass" type="button" id="loadMoreBtn">Load more</button>
            </div>
            <div id="loadSentinel" aria-hidden="true"></div>
        </main>
    </body>
</html>
