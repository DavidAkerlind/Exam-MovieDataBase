# Cloudflare Worker that keeps the TMDb / OMDb API keys off the client.
# Deploy:  npx wrangler deploy
# Secrets: npx wrangler secret put TMDB_API_KEY
#          npx wrangler secret put OMDB_API_KEY
name = "mmdb-api"
main = "src/index.js"
compatibility_date = "2025-01-01"

# API-ONLY deployment (advanced). Normally you deploy the repo root instead, where one
# Worker serves the site and this API together (see ../wrangler.toml and ../DEPLOY.md).
# Use this folder only when the site is hosted elsewhere (e.g. GitHub Pages) and just
# the API runs on Cloudflare. To give it its own domain, uncomment (the zone must be in
# the same Cloudflare account; the domain and certificate are created on deploy):
#
# [[routes]]
# pattern = "mmdb-api.example.com"
# custom_domain = true

[vars]
# Comma separated list of browser origins that may call the API.
# "https://*.example.com" style wildcards are supported.
ALLOWED_ORIGINS = "https://mmdb.davidakerlind.com,https://davidakerlind.github.io"
# Also allow http://localhost:<any port> and http://127.0.0.1:<any port> (local dev).
ALLOW_LOCALHOST = "true"
