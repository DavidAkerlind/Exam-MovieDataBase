# One Cloudflare Worker that serves the whole app:
#   - the website (index.html, scripts/, styles/, ... see .assetsignore for the exact list)
#   - the API under /api/*, which holds the TMDb / OMDb keys (worker/src)
# Because both live on one address there is nothing to connect and no CORS to set up.
#
# Deploy:  npx wrangler deploy
# Secrets: npx wrangler secret put TMDB_API_KEY
#          npx wrangler secret put OMDB_API_KEY
# (or Dashboard > Workers & Pages > mmdb > Settings > Variables and secrets)
name = "mmdb"
main = "worker/src/index.js"
compatibility_date = "2025-01-01"

[assets]
directory = "./"
# Only /api/* runs the Worker; every other path is a file from the site.
run_worker_first = ["/api/*"]

[vars]
# The site and the API share one origin, so nobody needs to be listed here. Add
# origins ("https://example.com", "https://*.example.com") only if ANOTHER site
# should be allowed to call this API from a browser.
ALLOWED_ORIGINS = ""
ALLOW_LOCALHOST = "false"
